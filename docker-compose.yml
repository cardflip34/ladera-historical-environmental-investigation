# Optional PostGIS backend. The platform runs file-based without this; enable when
# geospatial SQL is needed. Start with: docker compose up -d
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: lehrp-postgis
    environment:
      POSTGRES_USER: lehrp
      POSTGRES_PASSWORD: lehrp
      POSTGRES_DB: lehrp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lehrp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
